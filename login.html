<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RVCC Employee Portal | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="overlay">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-lg-5">

<div class="login-card">

<div class="text-center">

<img src="images/logo.png" class="logo">

<h2 class="mt-3 fw-bold">

RVCC Employee Portal

</h2>

<p class="subtitle">

Secure Employee Login

</p>

</div>

<div class="welcome-box">

<h5>

Welcome Back

</h5>

<p>

Please sign in using your employee credentials.

</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">

Username

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>

<input
type="text"
id="username"
class="form-control"
placeholder="Employee Username"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
id="togglePassword">

<i class="bi bi-eye-fill"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between mb-3">

<div class="form-check">

<input
type="checkbox"
class="form-check-input"
id="rememberMe">

<label class="form-check-label">

Remember Me

</label>

</div>

<a href="#" class="forgot-link">

Forgot Password?

</a>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-primary btn-lg">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</div>

<p id="error" class="text-danger text-center mt-3"></p>

</form>

<hr>

<div class="info">

<div>

<i class="bi bi-shield-lock-fill"></i>

Authorized Employees Only

</div>

<div>

<i class="bi bi-headset"></i>

IT Helpdesk: it.support@rvce.com.sa

</div>

<div id="clock"></div>

</div>

</div>

<div class="footer">

© Developed by RVCC IT DEPT. | Employee Forms Portal

</div>

</div>

</div>

</div>

</div>

<script src="js/login.js"></script>

</body>

</html>
